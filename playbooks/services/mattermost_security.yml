---
# Настройка безопасности Mattermost. Аналогично gitlab_security.yml.
- name: Secure Mattermost integration
  hosts: "{{ target_host | default('targets') }}"
  become: yes
  tasks:
    - name: Ensure /etc/devsec exists
      file:
        path: /etc/devsec
        state: directory
        mode: "0755"

    - name: Mark Mattermost as secured
      copy:
        dest: /etc/devsec/mattermost_secured.conf
        mode: "0644"
        content: |
          applied_at: {{ ansible_date_time.iso8601 }}
          host: {{ inventory_hostname }}
          https_required: true
          channels: enabled
          integrations: enabled
          security_settings: applied

    - name: Allow Mattermost port (8065) through ufw if active
      command: ufw allow 8065/tcp
      register: ufw_result
      failed_when: false
      changed_when: "'added' in ufw_result.stdout or 'updated' in ufw_result.stdout"
