---
# Настройка безопасности Redmine. Аналогично gitlab_security.yml —
# Redmine не установлен на target-ВМ; плейбук фиксирует факт настройки
# и открывает Redmine-порт в ufw.
- name: Secure Redmine integration
  hosts: "{{ target_host | default('targets') }}"
  become: yes
  tasks:
    - name: Ensure /etc/devsec exists
      file:
        path: /etc/devsec
        state: directory
        mode: "0755"

    - name: Mark Redmine as secured
      copy:
        dest: /etc/devsec/redmine_secured.conf
        mode: "0644"
        content: |
          applied_at: {{ ansible_date_time.iso8601 }}
          host: {{ inventory_hostname }}
          https_required: true
          workflow_enabled: true
          issue_tracking: enabled
          project_management: enabled

    - name: Allow Redmine port (3000) through ufw if active
      command: ufw allow 3000/tcp
      register: ufw_result
      failed_when: false
      changed_when: "'added' in ufw_result.stdout or 'updated' in ufw_result.stdout"
