---
- name: Secure Redmine configuration
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    redmine_config_path: "/opt/redmine/config/configuration.yml"

  tasks:
    - name: Install required packages
      package:
        name:
          - apache2
          - libapache2-mod-passenger
          - openssl
        state: present
      when: ansible_os_family == "Debian"

    - name: Generate SSL certificate for Redmine
      openssl_certificate:
        path: "/etc/ssl/certs/redmine.pem"
        privatekey_path: "/etc/ssl/private/redmine.key"
        provider: selfsigned
        force: no

    - name: Configure Apache for Redmine HTTPS
      template:
        src: templates/redmine-ssl.conf.j2
        dest: "/etc/apache2/sites-available/redmine-ssl.conf"
      notify: restart apache

    - name: Enable SSL site
      command: a2ensite redmine-ssl
      notify: restart apache

    - name: Enable required Apache modules
      apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - ssl
        - headers
        - rewrite
      notify: restart apache

    - name: Configure Redmine database security
      lineinfile:
        path: "{{ redmine_config_path }}"
        regexp: "^  password:"
        line: "  password: \"{{ redmine_db_password | default('CHANGE_THIS_PASSWORD') }}\""
        state: present

    - name: Set secure session store
      lineinfile:
        path: "{{ redmine_config_path }}"
        regexp: "^  session_store:"
        line: "  session_store: :active_record_store"
        state: present

    - name: Configure email encryption
      lineinfile:
        path: "{{ redmine_config_path }}"
        regexp: "^  smtp_settings:"
        line: |
          smtp_settings:
            tls: true
            enable_starttls_auto: true
        state: present

    - name: Disable Redmine demo projects
      command: >
        cd /opt/redmine &&
        bundle exec rake redmine:delete_demo_projects RAILS_ENV=production
      ignore_errors: yes

    - name: Update Redmine
      command: >
        cd /opt/redmine &&
        bundle exec rake db:migrate RAILS_ENV=production

  handlers:
    - name: restart apache
      service:
        name: apache2
        state: restarted