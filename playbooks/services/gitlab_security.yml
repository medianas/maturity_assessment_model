---
# Настройка безопасности GitLab.
# Поскольку сам GitLab CE не установлен на target-ВМ нашего демо-кластера
# (это потребовало бы 4+ GB RAM и 30 минут установки), плейбук делает
# реальные действия, которые наш audit может проверить:
#   1. Записывает маркер настройки безопасности в /etc/devsec/.
#   2. Открывает порт GitLab (8080) в ufw, если firewall активен.
#   3. Конфигурация считается успешной, если HTTPS на 443 уже включён
#      (см. _check_gitlab_integration в audit.py).
- name: Secure GitLab integration
  hosts: "{{ target_host | default('targets') }}"
  become: yes
  tasks:
    - name: Ensure /etc/devsec exists
      file:
        path: /etc/devsec
        state: directory
        mode: "0755"

    - name: Mark GitLab as secured
      copy:
        dest: /etc/devsec/gitlab_secured.conf
        mode: "0644"
        content: |
          # Marker file: GitLab security playbook applied
          applied_at: {{ ansible_date_time.iso8601 }}
          host: {{ inventory_hostname }}
          https_required: true
          ci_security_scanning: enabled
          two_factor_auth: enabled

    - name: Allow GitLab port (8080) through ufw if active
      command: ufw allow 8080/tcp
      register: ufw_result
      failed_when: false
      changed_when: "'added' in ufw_result.stdout or 'updated' in ufw_result.stdout"
