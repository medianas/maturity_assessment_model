---
# Install GitLab CE через docker-compose. Идемпотентен:
# повторный запуск не пересоздаёт контейнер если он уже здоров.
- name: Install GitLab CE
  hosts: "{{ target_host | default('gitlab_hosts') }}"
  become: yes
  vars:
    gitlab_url: "http://{{ ansible_host | default(inventory_hostname) }}"
    gitlab_root_password: "demoDEMOdemo123!"

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure docker keyring directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: |
        if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
        fi
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable\n"
        mode: "0644"

    - name: Install Docker engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Enable Docker
      service:
        name: docker
        enabled: yes
        state: started

    - name: Ensure /opt/gitlab exists
      file:
        path: /opt/gitlab
        state: directory
        mode: "0755"

    - name: Write docker-compose.yml for GitLab
      copy:
        dest: /opt/gitlab/docker-compose.yml
        mode: "0644"
        content: |
          services:
            gitlab:
              image: gitlab/gitlab-ce:16.11.10-ce.0
              container_name: gitlab
              restart: always
              hostname: '{{ ansible_host | default(inventory_hostname) }}'
              environment:
                GITLAB_OMNIBUS_CONFIG: |
                  external_url '{{ gitlab_url }}'
                  gitlab_rails['initial_root_password'] = '{{ gitlab_root_password }}'
                  gitlab_rails['gitlab_shell_ssh_port'] = 2222
                  prometheus_monitoring['enable'] = false
              ports:
                - "80:80"
                - "443:443"
                - "2222:22"
              volumes:
                - /opt/gitlab/config:/etc/gitlab
                - /opt/gitlab/logs:/var/log/gitlab
                - /opt/gitlab/data:/var/opt/gitlab
              shm_size: '256m'

    - name: Start GitLab via docker compose
      command: docker compose -f /opt/gitlab/docker-compose.yml up -d
      args:
        chdir: /opt/gitlab
      register: gitlab_up
      changed_when: "'Started' in gitlab_up.stdout or 'Created' in gitlab_up.stdout"

    - name: Wait for GitLab to become healthy (max 8 minutes)
      uri:
        url: "{{ gitlab_url }}/users/sign_in"
        validate_certs: no
        status_code: [200, 302]
      register: gitlab_check
      retries: 48
      delay: 10
      until: gitlab_check.status in [200, 302]
      ignore_errors: yes

    - name: Mark GitLab as deployed
      copy:
        dest: /etc/devsec/state.conf
        mode: "0644"
        content: |
          scenario=deployed
          service=gitlab
          deployed_at: {{ ansible_date_time.iso8601 }}
          url: {{ gitlab_url }}
