---
- name: Install Mattermost + PostgreSQL
  hosts: "{{ target_host | default('mattermost_hosts') }}"
  become: yes

  tasks:
    - name: Install Docker prerequisites
      apt:
        name: [ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure docker keyring directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: |
        if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
        fi
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable\n"
        mode: "0644"

    - name: Install Docker engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: Enable Docker
      service:
        name: docker
        enabled: yes
        state: started

    - name: Ensure /opt/mattermost layout
      file:
        path: "{{ item }}"
        state: directory
        owner: "2000"
        group: "2000"
        mode: "0755"
      loop:
        - /opt/mattermost/config
        - /opt/mattermost/data
        - /opt/mattermost/logs
        - /opt/mattermost/plugins
        - /opt/mattermost/client-plugins

    - name: Write docker-compose.yml for Mattermost
      copy:
        dest: /opt/mattermost/docker-compose.yml
        mode: "0644"
        content: |
          services:
            mm-db:
              image: postgres:15
              container_name: mm-db
              restart: always
              environment:
                POSTGRES_DB: mattermost
                POSTGRES_USER: mmuser
                POSTGRES_PASSWORD: mmpass
              volumes:
                - /opt/mattermost/db:/var/lib/postgresql/data
            mattermost:
              image: mattermost/mattermost-team-edition:9.5
              container_name: mattermost
              restart: always
              depends_on: [mm-db]
              environment:
                MM_SQLSETTINGS_DRIVERNAME: postgres
                MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmpass@mm-db:5432/mattermost?sslmode=disable&connect_timeout=10"
                MM_SERVICESETTINGS_SITEURL: ""
              ports:
                - "8065:8065"
              volumes:
                - /opt/mattermost/config:/mattermost/config
                - /opt/mattermost/data:/mattermost/data
                - /opt/mattermost/logs:/mattermost/logs
                - /opt/mattermost/plugins:/mattermost/plugins
                - /opt/mattermost/client-plugins:/mattermost/client/plugins

    - name: Start Mattermost via docker compose
      command: docker compose -f /opt/mattermost/docker-compose.yml up -d
      args:
        chdir: /opt/mattermost
      register: mm_up
      changed_when: "'Started' in mm_up.stdout or 'Created' in mm_up.stdout"

    - name: Wait for Mattermost API ping
      uri:
        url: "http://127.0.0.1:8065/api/v4/system/ping"
        validate_certs: no
        status_code: 200
      register: mm_check
      retries: 30
      delay: 10
      until: mm_check.status == 200
      ignore_errors: yes

    - name: Mark Mattermost as deployed
      copy:
        dest: /etc/devsec/state.conf
        mode: "0644"
        content: |
          scenario=deployed
          service=mattermost
          deployed_at: {{ ansible_date_time.iso8601 }}
