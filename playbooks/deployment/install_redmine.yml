---
- name: Install Redmine + PostgreSQL
  hosts: "{{ target_host | default('redmine_hosts') }}"
  become: yes

  tasks:
    - name: Install Docker prerequisites
      apt:
        name: [ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure docker keyring directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: |
        if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
        fi
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable\n"
        mode: "0644"

    - name: Install Docker engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: Enable Docker
      service:
        name: docker
        enabled: yes
        state: started

    - name: Ensure /opt/redmine exists
      file:
        path: /opt/redmine
        state: directory
        mode: "0755"

    - name: Write docker-compose.yml for Redmine
      copy:
        dest: /opt/redmine/docker-compose.yml
        mode: "0644"
        content: |
          services:
            redmine-db:
              image: postgres:15
              container_name: redmine-db
              restart: always
              environment:
                POSTGRES_DB: redmine
                POSTGRES_USER: redmine
                POSTGRES_PASSWORD: redminepass
              volumes:
                - /opt/redmine/db:/var/lib/postgresql/data
            redmine:
              image: redmine:5.1
              container_name: redmine
              restart: always
              depends_on: [redmine-db]
              environment:
                REDMINE_DB_POSTGRES: redmine-db
                REDMINE_DB_DATABASE: redmine
                REDMINE_DB_USERNAME: redmine
                REDMINE_DB_PASSWORD: redminepass
                REDMINE_SECRET_KEY_BASE: insecure-demo-key-change-me
              ports:
                - "3000:3000"
              volumes:
                - /opt/redmine/files:/usr/src/redmine/files

    - name: Start Redmine via docker compose (with retries — image pull может быть медленным)
      command: docker compose -f /opt/redmine/docker-compose.yml up -d
      args:
        chdir: /opt/redmine
      register: redmine_up
      changed_when: "'Started' in redmine_up.stdout or 'Created' in redmine_up.stdout"
      retries: 3
      delay: 5
      until: redmine_up.rc == 0
      ignore_errors: yes

    - name: Wait for Redmine
      uri:
        url: "http://127.0.0.1:3000/"
        validate_certs: no
        status_code: [200, 302]
      register: redmine_check
      retries: 30
      delay: 10
      until: redmine_check.status in [200, 302]
      ignore_errors: yes

    - name: Mark Redmine as deployed
      copy:
        dest: /etc/devsec/state.conf
        mode: "0644"
        content: |
          scenario=deployed
          service=redmine
          deployed_at: {{ ansible_date_time.iso8601 }}
