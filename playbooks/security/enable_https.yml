---
# Включение HTTPS на nginx-сервере с self-signed сертификатом.
# Идемпотентен: повторный запуск не пересоздаёт сертификат и не ломает конфиг.
- name: Enable HTTPS on web server
  hosts: "{{ target_host | default('targets') }}"
  become: yes
  vars:
    ssl_dir: /etc/nginx/ssl
    ssl_key: "{{ ssl_dir }}/server.key"
    ssl_crt: "{{ ssl_dir }}/server.crt"

  tasks:
    - name: Install nginx and openssl
      apt:
        name:
          - nginx
          - openssl
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure SSL directory exists
      file:
        path: "{{ ssl_dir }}"
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate (only if missing)
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ ssl_key }} -out {{ ssl_crt }}
        -subj "/C=RU/ST=Moscow/L=Moscow/O=Demo/CN={{ inventory_hostname }}"
      args:
        creates: "{{ ssl_crt }}"

    - name: Configure nginx with HTTP→HTTPS redirect
      copy:
        dest: /etc/nginx/sites-available/default
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl default_server;
              ssl_certificate     {{ ssl_crt }};
              ssl_certificate_key {{ ssl_key }};
              root /var/www/html;
              index index.html;
              server_name _;
              location / { try_files $uri $uri/ =404; }
          }
      notify: restart nginx

    - name: Enable nginx
      service:
        name: nginx
        enabled: yes
        state: started

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
